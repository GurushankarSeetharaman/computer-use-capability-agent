[pytest]
testpaths = tests
python_files = test_*.py

# Live tests drive a real browser against saucedemo, so they are excluded
# from the default run: the default suite must stay fast, hermetic and
# runnable with no network. Run them deliberately:
#     python -m pytest -m live
addopts = -ra -m "not live"
markers =
    live: drives a real browser against the live target site
